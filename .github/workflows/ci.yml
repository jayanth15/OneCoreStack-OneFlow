name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run backend tests
        run: pytest -q
      - name: Verify fresh-database migrations
        env:
          DATABASE_URL: sqlite:////tmp/oneflow-ci.db
        run: |
          python -c "from app.main import _migrate_database_on_startup; _migrate_database_on_startup()"
          python -c "from app.main import _migrate_database_on_startup; _migrate_database_on_startup()"
          python -m app.core.schema_validation

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
